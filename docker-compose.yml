version: '3.8'

x-airflow-common:
  &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: CeleryExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
  AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
  AIRFLOW__CORE__FERNET_KEY: 9Yt-Yv_1tfWe_P5dVe-vrU8HhFA1UpRT2U6Kj0XG0QE=
  AIRFLOW__WEBSERVER__SECRET_KEY: your_secret_key_here
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
  AIRFLOW_CONN_POSTGRES_STUDENTS: postgresql://airflow:airflow@postgres:5432/students_db
  AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
  AIRFLOW__DATABASE__LOAD_DEFAULT_CONNECTIONS: 'False'
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT: ''

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  redis:
    image: redis:latest
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 50

  airflow-webserver:
    image: apache/airflow:2.10.5
    depends_on:
      - postgres
      - redis
    environment:
      <<: *airflow-common-env
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    volumes:
      - ./airflow_home/dags:/opt/airflow/dags
      - ./airflow_home/logs:/opt/airflow/logs  # ADDED: Mount logs volume
      - ./airflow_home/plugins:/opt/airflow/plugins
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 20s
      timeout: 60s
      retries: 50

  airflow-scheduler:
    image: apache/airflow:2.10.5
    depends_on:
      - airflow-webserver
    environment:
      <<: *airflow-common-env
    volumes:
      - ./airflow_home/dags:/opt/airflow/dags
      - ./airflow_home/logs:/opt/airflow/logs
      - ./airflow_home/plugins:/opt/airflow/plugins
    command: scheduler

  airflow-worker:
    image: apache/airflow:2.10.5
    depends_on:
      - airflow-scheduler
    environment:
      <<: *airflow-common-env
    volumes:
      - ./airflow_home/dags:/opt/airflow/dags
      - ./airflow_home/logs:/opt/airflow/logs
      - ./airflow_home/plugins:/opt/airflow/plugins
    command: celery worker

  airflow-init:
    image: apache/airflow:2.10.5
    depends_on:
      - postgres
    environment:
      <<: *airflow-common-env
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    volumes:
      - ./airflow_home/dags:/opt/airflow/dags
      - ./airflow_home/logs:/opt/airflow/logs
      - ./airflow_home/plugins:/opt/airflow/plugins
    command: db init

  airflow-mcp-server:
    build:
      context: ./airflow-mcp
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - AIRFLOW_PASSWORD=airflow
      - AIRFLOW_USERNAME=airflow
      - AIRFLOW_HOST=http://airflow-webserver:8080
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3000
      - LOG_LEVEL=info
    volumes:
      - ./airflow-mcp/server.py:/app/server.py
      - ./airflow-mcp/http_utils.py:/app/http_utils.py
      - ./airflow-mcp/tools:/app/tools
      - ./airflow-mcp/schema:/app/schema
      - ./airflow-mcp/requirements.txt:/app/requirements.txt
    depends_on:
      airflow-webserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:3000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  github-mcp-server:
    build:
      context: ./github-mcp
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - GITHUB_PAT_TOKEN=${GITHUB_PAT_TOKEN}
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3002
      - LOG_LEVEL=info
    volumes:
      - ./github-mcp/server.py:/app/server.py
      - ./github-mcp/http_utils.py:/app/http_utils.py
      - ./github-mcp/tools:/app/tools
      - ./github-mcp/schema:/app/schema
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:3002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Main Vayu Orchestrator Agent
  vayu-orchestrator:
    build:
      context: ./adk_agent
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      - PYTHONPATH=/app
      - AIRFLOW_MCP_HOST=${AIRFLOW_MCP_HOST:-airflow-mcp-server}
      - A2A_HOST=${A2A_HOST:-vayu-agents}
      - A2A_PORT=${A2A_PORT:-8001}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GIT_PAT_TOKEN=${GITHUB_PAT_TOKEN}
      - DAG_REPOSITORY=${DAG_REPOSITORY}
    volumes:
      - ./adk_agent/vayu_agent:/app/vayu_agent
    command: ["adk", "web", "--allow_origins=*", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      - vayu-agents
      - airflow-mcp-server
      - airflow-webserver
    restart: unless-stopped

  # DAG Troubleshooter Remote Agent
  vayu-agents:
    build:
      context: ./adk_agent
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
      - AIRFLOW_MCP_HOST=${AIRFLOW_MCP_HOST:-airflow-mcp-server}
      - AIRFLOW_MCP_PORT=${AIRFLOW_MCP_PORT:-3000}
      - GITHUB_MCP_HOST=github-mcp-server
      - GITHUB_MCP_PORT=3002
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GIT_PAT_TOKEN=${GITHUB_PAT_TOKEN}
      - DAG_REPOSITORY=${DAG_REPOSITORY}
    volumes:
      - ./adk_agent/vayu_agent:/app/vayu_agent
    command: ["adk", "api_server", "--a2a", "--port", "8001","--host", "0.0.0.0", "vayu_agent/remote_agents"]
    depends_on:
      - airflow-mcp-server
      - github-mcp-server
      - airflow-webserver
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  students-api:
    build:
      context: ./students_api
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    environment:
      - DATABASE_URL=postgresql://airflow:airflow@postgres:5432/students_db
    volumes:
      - ./students_api/app.py:/app/app.py
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  postgres-data: